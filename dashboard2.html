<html lang="en">

    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Top Header -->
    <header class="bg-blue-700 text-white p-5 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">🌤️ Seri Iskandar IoT Weather Dashboard</h1>
                <p class="text-blue-200 text-xs mt-1">72-Hour Continuous Series</p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">

        <!-- Day Filter & Parameter Selector -->
        <div class="bg-white p-4 rounded-xl shadow-sm border mb-6 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-slate-600">📅 Day:</span>
                <button onclick="setDay('ALL')" id="btn-ALL" class="day-btn px-3 py-1.5 text-sm rounded bg-blue-600 text-white font-medium">All (72h)</button>
                <button onclick="setDay('2026-11-10')" id="btn-2026-11-10" class="day-btn px-3 py-1.5 text-sm rounded bg-white border text-slate-700 font-medium">10 November 2026</button>
                <button onclick="setDay('2026-11-11')" id="btn-2026-11-11" class="day-btn px-3 py-1.5 text-sm rounded bg-white border text-slate-700 font-medium">11 November 2026</button>
                <button onclick="setDay('2026-11-12')" id="btn-2026-11-12" class="day-btn px-3 py-1.5 text-sm rounded bg-white border text-slate-700 font-medium">12 November 2026</button>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-slate-600">📊 Metric:</span>
                <select id="metricSelect" onchange="renderDashboard()" class="border p-2 text-sm rounded bg-slate-50 font-medium">
                    <option value="temp">Temperature (°C)</option>
                    <option value="humidity">Humidity (%)</option>
                    <option value="rain">Precipitation (mm)</option>
                    <option value="wind">Wind Speed (km/h)</option>
                </select>
            </div>
        </div>

        <!-- Main Chart Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
            <h3 id="chartTitle" class="font-bold text-slate-700 mb-4">Hourly Temperature Trend</h3>
            <div class="relative h-72">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="p-4 border-b">
                <h3 class="font-bold text-slate-700">📋 Weather Logs</h3>
            </div>
            <div class="overflow-x-auto max-h-80">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-600 sticky top-0">
                        <tr>
                            <th class="p-3">Date & Time</th>
                            <th class="p-3">Temperature</th>
                            <th class="p-3">Humidity</th>
                            <th class="p-3">Rainfall</th>
                            <th class="p-3">Wind Speed</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y"></tbody>
                </table>
            </div>
        </div>

    </main>

            {"time":"2026-11-12T23:00","temp":24.0,"humidity":99,"rain":0.7,"wind":11.3}
        ];

        let selectedDay = 'ALL';
        let chartInstance = null;

        function formatDate(iso) {
            const [d, t] = iso.split('T');
            const [y, m, day] = d.split('-');
            return `${day}-${m}-${y} ${t}`;
        }

        function setDay(day) {
            selectedDay = day;
            document.querySelectorAll('.day-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white');
                b.classList.add('bg-white', 'text-slate-700');
            });
            document.getElementById('btn-' + day).classList.remove('bg-white', 'text-slate-700');
            document.getElementById('btn-' + day).classList.add('bg-blue-600', 'text-white');
            renderDashboard();
        }

        function renderDashboard() {
            const metric = document.getElementById('metricSelect').value;

            // Filter data by selected day only
            const filtered = rawData.filter(r => {
                return (selectedDay === 'ALL' || r.time.startsWith(selectedDay));
            });

            // Update Table
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = filtered.map(r => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-mono text-xs">${formatDate(r.time)}</td>
                    <td class="p-3 text-orange-600 font-medium">${r.temp} °C</td>
                    <td class="p-3 text-blue-600">${r.humidity} %</td>
                    <td class="p-3 text-cyan-700">${r.rain} mm</td>
                    <td class="p-3 text-slate-600">${r.wind} km/h</td>
                </tr>
            `).join('');

            // Update Chart
            const labels = filtered.map(r => r.time.split('T')[1]);
            const values = filtered.map(r => r[metric]);
            const colors = { temp: '#f97316', humidity: '#2563eb', rain: '#06b6d4', wind: '#10b981' };
            const labelsMap = { temp: 'Temperature (°C)', humidity: 'Humidity (%)', rain: 'Precipitation (mm)', wind: 'Wind Speed (km/h)' };

            document.getElementById('chartTitle').innerText = `Hourly ${labelsMap[metric]}`;
            
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('mainChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: metric === 'rain' ? 'bar' : 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelsMap[metric],
                        data: values,
                        borderColor: colors[metric],
                        backgroundColor: colors[metric] + '33',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { tooltip: { enabled: true } },
                    scales: { x: { ticks: { maxTicksLimit: 10 } } }
                }
            });
        }

        // Initial render
        renderDashboard();
    </script>

</html>
